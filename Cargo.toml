[package]
name = "textura"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
# Pinned to the 8.x line to match `ffmpeg_8` in flake.nix. The crate's major
# version tracks FFmpeg's, so bumping one means bumping the other.
ffmpeg-next = "8.1"
# crossterm comes in via ratatui's re-export; no direct dependency needed.
ratatui = "0.29.0"
