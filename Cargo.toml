[package]
name = "textura"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.5.30", features = ["derive"] }
crossterm = "0.26.1"
image = "0.24.6"
# Pinned to the 8.x line to match `ffmpeg_8` in flake.nix. The crate's major
# version tracks FFmpeg's, so bumping one means bumping the other.
ffmpeg-next = "8.1"
ratatui = "0.29.0"
