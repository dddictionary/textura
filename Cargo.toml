[package]
name = "textura"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["native"]
# Everything that needs a real OS: ffmpeg decoding, the terminal UI, the CLI.
# The wasm build leaves this off, which is what lets the crate compile for
# wasm32 at all - ffmpeg cannot be built for the browser.
native = ["dep:ffmpeg-next", "dep:ratatui", "dep:clap"]

[dependencies]
clap = { version = "4.5.30", features = ["derive"], optional = true }
# Pinned to the 8.x line to match `ffmpeg_8` in flake.nix. The crate's major
# version tracks FFmpeg's, so bumping one means bumping the other.
ffmpeg-next = { version = "8.1", optional = true }
# crossterm comes in via ratatui's re-export; no direct dependency needed.
ratatui = { version = "0.29.0", optional = true }

# In the browser the *browser* is the frame source: getUserMedia replaces the
# capture device and canvas.drawImage replaces swscale, so only the pure glyph
# logic needs to cross over.
[target.'cfg(target_arch = "wasm32")'.dependencies]
# Pinned exactly: wasm-bindgen requires the crate and the CLI to match, and
# the CLI comes from nixpkgs (see flake.nix).
wasm-bindgen = "=0.2.121"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "textura"
path = "src/main.rs"
required-features = ["native"]
